<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>任務中控台</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="任務中控台">
<meta name="theme-color" content="#5E5CE6">
<style>
  :root {
    --bg: #F2F2F5;
    --surface: #FFFFFF;
    --surface-2: #F7F7F9;
    --border: #E2E2E6;
    --text: #1D1D1F;
    --text-secondary: #6E6E73;
    --text-tertiary: #98989D;
    --accent: #5E5CE6;
    --accent-soft: #EDEDFC;
    --accent-contrast: #FFFFFF;
    --status-pending: #8E8E93;
    --status-pending-bg: #F2F2F3;
    --status-progress: #0A84FF;
    --status-progress-bg: #E8F2FF;
    --status-waiting: #FF9F0A;
    --status-waiting-bg: #FFF3E0;
    --status-done: #2FA84B;
    --status-done-bg: #E7F8EC;
    --danger: #FF3B30;
    --danger-bg: #FFEBEA;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
    --shadow-md: 0 12px 32px rgba(0,0,0,0.14);
    --radius-lg: 18px;
    --radius-md: 13px;
    --radius-sm: 9px;
    --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang TC", "Microsoft JhengHei", "Segoe UI", Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #19191B; --surface: #29292B; --surface-2: #232325; --border: #3A3A3C;
      --text: #F5F5F7; --text-secondary: #AEAEB2; --text-tertiary: #8E8E93;
      --accent: #7D7AFF; --accent-soft: #2C2A54; --accent-contrast: #FFFFFF;
      --status-pending: #9A9A9E; --status-pending-bg: #38383A;
      --status-progress: #409CFF; --status-progress-bg: #123054;
      --status-waiting: #FFB340; --status-waiting-bg: #452F0E;
      --status-done: #45C468; --status-done-bg: #143820;
      --danger: #FF453A; --danger-bg: #3E1613;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.4); --shadow-md: 0 12px 32px rgba(0,0,0,0.55);
    }
  }
  :root[data-theme="dark"] {
    --bg: #19191B; --surface: #29292B; --surface-2: #232325; --border: #3A3A3C;
    --text: #F5F5F7; --text-secondary: #AEAEB2; --text-tertiary: #8E8E93;
    --accent: #7D7AFF; --accent-soft: #2C2A54; --accent-contrast: #FFFFFF;
    --status-pending: #9A9A9E; --status-pending-bg: #38383A;
    --status-progress: #409CFF; --status-progress-bg: #123054;
    --status-waiting: #FFB340; --status-waiting-bg: #452F0E;
    --status-done: #45C468; --status-done-bg: #143820;
    --danger: #FF453A; --danger-bg: #3E1613;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.4); --shadow-md: 0 12px 32px rgba(0,0,0,0.55);
  }

  * { box-sizing: border-box; }
  html, body { background: var(--bg); margin: 0; }
  body {
    font-family: var(--font-ui);
    color: var(--text);
    font-size: 16px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  .app { max-width: 720px; margin: 0 auto; padding: 0 16px 96px; }

  .topbar {
    position: sticky; top: 0; z-index: 20;
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    padding: 14px 0 10px;
    border-bottom: 1px solid var(--border);
  }
  .topbar-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 16px; max-width: 720px; margin: 0 auto; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-title { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
  .icon-btn {
    width: 38px; height: 38px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: var(--surface-2); border: 1px solid var(--border);
    color: var(--text-secondary); font-size: 17px; cursor: pointer;
    transition: transform .12s ease, background .12s ease;
  }
  .icon-btn:hover { background: var(--accent-soft); color: var(--accent); }
  .icon-btn:active { transform: scale(0.92); }
  .primary-btn {
    background: var(--accent); color: var(--accent-contrast);
    border: none; border-radius: var(--radius-sm);
    padding: 10px 16px; font-size: 15px; font-weight: 600;
    cursor: pointer; font-family: var(--font-ui);
    display: inline-flex; align-items: center; gap: 6px;
    transition: opacity .12s ease, transform .12s ease;
  }
  .primary-btn:hover { opacity: 0.88; }
  .primary-btn:active { transform: scale(0.97); }
  .secondary-btn {
    background: var(--surface-2); color: var(--text);
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 10px 16px; font-size: 15px; font-weight: 600; cursor: pointer;
    font-family: var(--font-ui);
  }
  .text-btn { background: none; border: none; color: var(--accent); font-size: 15px; font-weight: 600; cursor: pointer; font-family: var(--font-ui); padding: 6px 0; }
  .danger-text-btn { background: none; border: none; color: var(--danger); font-size: 15px; font-weight: 600; cursor: pointer; font-family: var(--font-ui); }

  .stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 16px 0; }
  .stat-tile { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 12px 10px; text-align: center; box-shadow: var(--shadow-sm); }
  .stat-num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 22px; font-weight: 700; }
  .stat-label { font-size: 12.5px; color: var(--text-secondary); margin-top: 2px; }
  .stat-tile.warn .stat-num { color: var(--danger); }

  .toggle-row { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 14px; }
  .switch { position: relative; width: 46px; height: 27px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch .slider { position: absolute; inset: 0; background: var(--border); border-radius: 27px; cursor: pointer; transition: background .15s ease; }
  .switch .slider::before { content: ""; position: absolute; width: 23px; height: 23px; left: 2px; top: 2px; background: #fff; border-radius: 50%; transition: transform .15s ease; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
  .switch input:checked + .slider { background: var(--status-done); }
  .switch input:checked + .slider::before { transform: translateX(19px); }
  .toggle-label { font-size: 15px; font-weight: 500; }

  .segmented { display: flex; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 3px; overflow-x: auto; gap: 2px; }
  .segmented button {
    flex: 1; white-space: nowrap; border: none; background: transparent; color: var(--text-secondary);
    font-family: var(--font-ui); font-size: 14.5px; font-weight: 600; padding: 8px 10px; border-radius: 7px; cursor: pointer;
  }
  .segmented button.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }

  .chip-row { display: flex; gap: 8px; overflow-x: auto; padding: 12px 0 4px; }
  .chip {
    flex: 0 0 auto; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text-secondary); font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .chip.active { background: var(--accent); color: var(--accent-contrast); border-color: var(--accent); }

  .task-list { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
  .task-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
    padding: 14px 16px; box-shadow: var(--shadow-sm); cursor: pointer;
    display: flex; flex-direction: column; gap: 8px;
    transition: transform .1s ease, box-shadow .1s ease;
  }
  .task-card:hover { box-shadow: var(--shadow-md); }
  .task-card:active { transform: scale(0.995); }
  .task-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .task-title { font-size: 17px; font-weight: 650; letter-spacing: -0.005em; flex: 1; }
  .status-pill { flex: 0 0 auto; font-size: 12.5px; font-weight: 700; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
  .task-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; font-size: 14px; color: var(--text-secondary); }
  .meta-tag { background: var(--surface-2); padding: 3px 9px; border-radius: 7px; font-weight: 600; font-size: 13px; }
  .due-badge { font-family: var(--font-mono); font-weight: 600; font-size: 13px; }
  .due-badge.overdue { color: var(--danger); }
  .due-badge.soon { color: var(--status-waiting); }
  .avatars { display: flex; align-items: center; }
  .avatar {
    width: 26px; height: 26px; border-radius: 50%; background: var(--accent-soft); color: var(--accent);
    font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center;
    border: 2px solid var(--surface); margin-left: -8px;
  }
  .avatar:first-child { margin-left: 0; }

  .person-chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .person-chip { font-size: 12.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); color: var(--text-secondary); }
  .person-chip.host { background: var(--accent-soft); color: var(--accent); font-weight: 700; }

  .parent-breadcrumb { font-size: 12.5px; color: var(--text-tertiary); font-weight: 600; margin-bottom: -2px; }
  .delay-tag { font-size: 12.5px; font-weight: 700; color: var(--danger); }
  .blocked-tag { font-size: 12.5px; font-weight: 700; color: var(--status-waiting); }

  .subtask-list { display: flex; flex-direction: column; gap: 6px; margin: 6px 0 10px; }
  .subtask-item { display: flex; align-items: center; gap: 8px; background: var(--surface-2); border-radius: var(--radius-sm); padding: 8px 10px; cursor: pointer; }
  .subtask-item .status-pill { font-size: 11px; padding: 2px 8px; }
  .subtask-title { flex: 1; font-size: 14px; font-weight: 600; }

  .gantt-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--border); }
  .gantt-row:last-child { border-bottom: none; }
  .gantt-label { flex: 0 0 128px; font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
  .gantt-track { flex: 1; position: relative; height: 22px; background: var(--surface-2); border-radius: 6px; overflow: hidden; }
  .gantt-bar { position: absolute; top: 3px; height: 16px; border-radius: 999px; cursor: pointer; }
  .gantt-today-line { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--danger); z-index: 2; }
  .gantt-scale { display: flex; font-family: var(--font-mono); font-size: 11px; color: var(--text-tertiary); margin: 0 0 6px 138px; }
  .gantt-scroll { overflow-x: auto; }
  .gantt-inner { min-width: 640px; }

  .workload-section { margin-top: 22px; }
  .workload-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .workload-row:last-child { border-bottom: none; }
  .workload-name { flex: 0 0 96px; font-size: 14px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .workload-bar-track { flex: 1; height: 10px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
  .workload-bar-fill { height: 100%; background: var(--accent); border-radius: 999px; }
  .workload-count { flex: 0 0 46px; text-align: right; font-family: var(--font-mono); font-weight: 700; font-size: 13px; }

  .kanban-board { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; align-items: flex-start; }
  .kanban-column { flex: 0 0 250px; background: var(--surface-2); border-radius: var(--radius-lg); padding: 10px; }
  .kanban-column-header { display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 700; padding: 4px 6px 10px; }
  .kanban-count { font-family: var(--font-mono); color: var(--text-tertiary); font-weight: 600; }
  .kanban-card { background: var(--surface); border-radius: var(--radius-md); padding: 10px 12px; margin-bottom: 8px; box-shadow: var(--shadow-sm); cursor: pointer; }
  .kanban-card-title { font-size: 14px; font-weight: 650; margin-bottom: 6px; }
  .kanban-card-meta { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--text-secondary); }
  .kanban-advance-btn { background: var(--accent-soft); color: var(--accent); border: none; border-radius: 6px; padding: 3px 8px; font-size: 12px; font-weight: 700; cursor: pointer; }

  #searchInput { font-size: 15px; }

  .empty-state { text-align: center; padding: 64px 20px; color: var(--text-secondary); }
  .empty-state .glyph { font-size: 40px; margin-bottom: 10px; }

  .fab {
    position: fixed; right: 20px; bottom: 24px; width: 58px; height: 58px; border-radius: 50%;
    background: var(--accent); color: var(--accent-contrast); border: none; font-size: 26px;
    box-shadow: 0 8px 24px rgba(0,0,0,.25); cursor: pointer; z-index: 30;
    display: flex; align-items: center; justify-content: center;
  }
  .fab:active { transform: scale(0.94); }

  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.32); backdrop-filter: blur(4px);
    display: flex; align-items: flex-end; justify-content: center; z-index: 100;
  }
  .modal-sheet {
    background: var(--surface); width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto;
    border-radius: 20px 20px 0 0; box-shadow: var(--shadow-md); padding: 20px 20px calc(20px + env(safe-area-inset-bottom));
  }
  @media (min-width: 640px) {
    .modal-backdrop { align-items: center; }
    .modal-sheet { border-radius: 20px; margin-bottom: 5vh; }
  }
  .sheet-handle { width: 36px; height: 5px; background: var(--border); border-radius: 3px; margin: 0 auto 14px; }
  .sheet-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; gap: 10px; }
  .sheet-title { font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }

  label.field-label { display: block; font-size: 13.5px; font-weight: 700; color: var(--text-secondary); margin: 14px 0 6px; text-transform: uppercase; letter-spacing: .03em; }
  input[type=text], input[type=date], textarea, select {
    width: 100%; font-family: var(--font-ui); font-size: 16px; padding: 11px 12px;
    border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
  }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  textarea { resize: vertical; min-height: 70px; font-family: var(--font-ui); }

  .status-select-wrap { margin: 4px 0 6px; }
  .status-select {
    width: 100%; font-weight: 700; font-size: 15px; padding: 10px 12px; border-radius: 999px;
    border: 1.5px solid var(--border); appearance: none; -webkit-appearance: none; text-align: center;
    background-position: right 14px center; cursor: pointer;
  }

  .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 14px 0; }
  .info-item { background: var(--surface-2); border-radius: var(--radius-md); padding: 10px 12px; }
  .info-item .k { font-size: 12px; color: var(--text-tertiary); font-weight: 700; text-transform: uppercase; letter-spacing: .03em; }
  .info-item .v { font-size: 15.5px; font-weight: 600; margin-top: 3px; word-break: break-word; }
  .collab-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .collab-chip { background: var(--accent-soft); color: var(--accent); font-size: 13px; font-weight: 700; padding: 3px 9px; border-radius: 999px; }

  .divider { height: 1px; background: var(--border); margin: 16px 0; border: none; }

  .log-list { display: flex; flex-direction: column; gap: 12px; margin: 10px 0; }
  .log-entry { display: flex; gap: 10px; }
  .log-body { flex: 1; background: var(--surface-2); border-radius: var(--radius-md); padding: 10px 12px; }
  .log-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .log-author { font-weight: 700; font-size: 14.5px; }
  .log-time { font-family: var(--font-mono); font-size: 12px; color: var(--text-tertiary); white-space: nowrap; }
  .log-text { font-size: 15px; margin-top: 4px; white-space: pre-wrap; }
  .log-status-tag { display: inline-block; margin-top: 6px; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }

  .compose-row { display: flex; gap: 8px; align-items: flex-end; position: sticky; bottom: -20px; background: var(--surface); padding-top: 10px; }
  .compose-row textarea { min-height: 44px; }

  .onboarding { max-width: 480px; margin: 12vh auto; padding: 0 20px; text-align: center; }
  .onboarding .glyph { font-size: 46px; margin-bottom: 14px; }
  .onboarding h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
  .onboarding p { color: var(--text-secondary); font-size: 15px; margin-bottom: 20px; line-height: 1.6; }
  .onboarding input { margin-bottom: 12px; }

  .toast {
    position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%);
    background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 999px;
    font-size: 14.5px; font-weight: 600; box-shadow: var(--shadow-md); z-index: 200; opacity: 0; pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-6px); }

  [hidden] { display: none !important; }
  ::selection { background: var(--accent-soft); }

  .view-switch { margin: 14px 0 4px; }

  .reminder-banner { margin: 14px 0 2px; }
  .reminder-banner-title { font-size: 13.5px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .03em; margin-bottom: 8px; }
  .reminder-scroll { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; }
  .reminder-card {
    flex: 0 0 auto; min-width: 200px; max-width: 240px; border-radius: var(--radius-md);
    padding: 10px 12px; cursor: pointer; border: 1px solid transparent;
  }
  .reminder-card.overdue { background: var(--danger-bg); border-color: color-mix(in srgb, var(--danger) 35%, transparent); }
  .reminder-card.soon { background: var(--status-waiting-bg); border-color: color-mix(in srgb, var(--status-waiting) 35%, transparent); }
  .reminder-card-date { font-family: var(--font-mono); font-size: 12px; font-weight: 700; }
  .reminder-card.overdue .reminder-card-date { color: var(--danger); }
  .reminder-card.soon .reminder-card-date { color: var(--status-waiting); }
  .reminder-card-label { font-size: 14px; font-weight: 600; margin-top: 3px; }
  .reminder-card-sub { font-size: 12.5px; color: var(--text-secondary); margin-top: 1px; }

  .dept-grid { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
  .dept-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 14px 16px; box-shadow: var(--shadow-sm); cursor: pointer; }
  .dept-card-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .dept-card-name { font-size: 16.5px; font-weight: 700; }
  .dept-card-pct { font-family: var(--font-mono); font-size: 14px; font-weight: 700; color: var(--text-secondary); }
  .dept-progress-track { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; margin-bottom: 8px; }
  .dept-progress-fill { height: 100%; background: var(--status-done); border-radius: 999px; }
  .dept-card-stats { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--text-secondary); }
  .dept-stat-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }

  .milestone-list { display: flex; flex-direction: column; gap: 6px; margin: 6px 0 10px; }
  .milestone-item { display: flex; align-items: center; gap: 8px; background: var(--surface-2); border-radius: var(--radius-sm); padding: 7px 10px; }
  .milestone-date { font-family: var(--font-mono); font-size: 12.5px; font-weight: 700; color: var(--accent); flex: 0 0 auto; }
  .milestone-label { font-size: 14px; flex: 1; }
  .milestone-add-row { display: flex; gap: 6px; margin-top: 4px; }
  .milestone-add-row input[type=date] { flex: 0 0 132px; }
  .milestone-add-row input[type=text] { flex: 1; }

  .priority-flag { font-size: 12.5px; font-weight: 700; }
  .priority-flag.高 { color: var(--danger); }
  .priority-flag.中 { color: var(--status-waiting); }
  .priority-flag.低 { color: var(--text-tertiary); }

  .archived-tag { font-size: 12px; font-weight: 700; color: var(--text-tertiary); background: var(--surface-2); padding: 3px 9px; border-radius: 7px; }
  .task-card.is-archived { opacity: 0.6; }

  .task-link { display: inline-flex; align-items: center; gap: 4px; color: var(--accent); font-size: 14.5px; font-weight: 600; text-decoration: none; word-break: break-all; }

  .member-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--border); }
  .member-row:last-child { border-bottom: none; }
  .member-name { font-weight: 600; font-size: 14.5px; flex: 0 0 auto; min-width: 64px; }
  .member-email { font-size: 13.5px; color: var(--text-secondary); flex: 1; word-break: break-all; }
  .member-add-row { display: flex; gap: 6px; margin-top: 10px; }
  .member-add-row input { flex: 1; }

  .cal-header { display: flex; align-items: center; justify-content: space-between; margin: 14px 0 10px; }
  .cal-title { font-size: 17px; font-weight: 700; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-dow { text-align: center; font-size: 12px; font-weight: 700; color: var(--text-tertiary); padding: 4px 0; }
  .cal-cell {
    aspect-ratio: 1; border-radius: var(--radius-sm); background: var(--surface); border: 1px solid var(--border);
    padding: 5px; display: flex; flex-direction: column; cursor: pointer; overflow: hidden;
  }
  .cal-cell.other-month { opacity: 0.35; }
  .cal-cell.is-today { border-color: var(--accent); border-width: 2px; }
  .cal-cell-num { font-family: var(--font-mono); font-size: 12.5px; font-weight: 700; }
  .cal-dots { display: flex; flex-wrap: wrap; gap: 2px; margin-top: 3px; }
  .cal-dot { width: 6px; height: 6px; border-radius: 50%; }
  .cal-more { font-size: 10px; color: var(--text-tertiary); margin-top: 2px; }
</style>
</head>
<body>

<div id="onboarding" class="onboarding" hidden>
  <div class="glyph">🔗</div>
  <h1>連接資料來源</h1>
  <p>請貼上部署 Google Apps Script 後拿到的網址（結尾是 <code>/exec</code>），資料會存在你自己的 Google 試算表裡，所有裝置共用同一份。</p>
  <input type="text" id="onboardingUrlInput" placeholder="https://script.google.com/macros/s/.../exec">
  <button class="primary-btn" style="width:100%; justify-content:center;" onclick="saveApiUrl()">連接</button>
</div>

<div id="mainApp" hidden>
  <div class="topbar">
    <div class="topbar-row">
      <div class="brand">
        <span style="font-size:22px;">📋</span>
        <span class="brand-title">任務中控台</span>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="icon-btn" onclick="openSettings()" title="設定">⚙︎</button>
        <button class="icon-btn" onclick="refreshTasks(true)" title="重新整理">⟳</button>
      </div>
    </div>
  </div>

  <div class="app">
    <div class="stat-row" id="statRow"></div>

    <div class="reminder-banner" id="reminderBanner" hidden>
      <div class="reminder-banner-title">🔔 近期提醒</div>
      <div class="reminder-scroll" id="reminderScroll"></div>
    </div>

    <div class="segmented view-switch" id="viewSwitch"></div>

    <div id="listView">
      <input type="text" id="searchInput" placeholder="🔍 搜尋任務標題或說明…" oninput="renderTasks()" style="margin:4px 0 10px;">
      <div class="toggle-row">
        <span class="toggle-label">只看指派給我的</span>
        <label class="switch">
          <input type="checkbox" id="onlyMineToggle" onchange="renderTasks()">
          <span class="slider"></span>
        </label>
      </div>
      <div class="toggle-row">
        <span class="toggle-label">顯示已封存的任務</span>
        <label class="switch">
          <input type="checkbox" id="showArchivedToggle" onchange="renderTasks()">
          <span class="slider"></span>
        </label>
      </div>

      <div class="segmented" id="statusFilter"></div>
      <div class="chip-row" id="deptFilter"></div>

      <div class="task-list" id="taskList"></div>
    </div>

    <div id="deptOverview" hidden>
      <div class="dept-grid" id="deptGrid"></div>
      <div class="workload-section">
        <label class="field-label" style="margin-top:0;">人員工作量（進行中的任務數）</label>
        <div id="workloadList"></div>
      </div>
    </div>

    <div id="calendarView" hidden>
      <div class="cal-header">
        <button class="icon-btn" onclick="shiftCalMonth(-1)">‹</button>
        <div class="cal-title" id="calTitle"></div>
        <button class="icon-btn" onclick="shiftCalMonth(1)">›</button>
      </div>
      <div class="cal-grid" id="calGrid"></div>
    </div>

    <div id="ganttView" hidden>
      <div class="cal-header">
        <button class="icon-btn" onclick="shiftGanttWindow(-1)">‹</button>
        <div class="cal-title" id="ganttTitle"></div>
        <button class="icon-btn" onclick="shiftGanttWindow(1)">›</button>
      </div>
      <div class="gantt-scroll">
        <div class="gantt-inner">
          <div class="gantt-scale" id="ganttScale"></div>
          <div id="ganttRows"></div>
        </div>
      </div>
    </div>

    <div id="kanbanView" hidden>
      <div class="kanban-board" id="kanbanBoard"></div>
    </div>

    <div id="feedView" hidden>
      <div class="log-list" id="feedList"></div>
    </div>
  </div>

  <button class="fab" onclick="openNewTask()" title="新增任務">＋</button>
</div>

<div id="toast" class="toast"></div>
<div id="modalRoot"></div>

<script>
  var DEFAULT_API_URL = 'https://script.google.com/macros/s/AKfycbxguQ0ErK1emNTAgjxN6RJwfWqbjd4E5FW6ZCcqvIUFI_afnb7IQNJbKfrue-KXrFJBGg/exec';

  var STATUS_ORDER = ['待處理', '進行中', '等待協辦', '已完成'];
  var STATUS_META = {
    '待處理':  { fg: 'var(--status-pending)',  bg: 'var(--status-pending-bg)' },
    '進行中':  { fg: 'var(--status-progress)', bg: 'var(--status-progress-bg)' },
    '等待協辦': { fg: 'var(--status-waiting)',  bg: 'var(--status-waiting-bg)' },
    '已完成':  { fg: 'var(--status-done)',     bg: 'var(--status-done-bg)' }
  };

  var state = {
    apiUrl: '',
    userName: '',
    tasks: [],
    members: [],
    statusFilter: '全部',
    deptFilter: '全部',
    view: 'list',
    calYear: new Date().getFullYear(),
    calMonth: new Date().getMonth(),
    ganttOffset: 0,
    loading: false,
    pollTimer: null
  };

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function safeGetItem(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
  function safeSetItem(key, val) { try { localStorage.setItem(key, val); } catch (e) {} }

  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function () { t.classList.remove('show'); }, 2400);
  }

  // ---------- API ----------
  function apiGet(action, params) {
    var url = state.apiUrl + '?action=' + encodeURIComponent(action);
    for (var k in (params || {})) url += '&' + k + '=' + encodeURIComponent(params[k]);
    return fetch(url).then(function (r) { return r.json(); });
  }
  function apiPost(payload) {
    return fetch(state.apiUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    }).then(function (r) { return r.json(); });
  }

  // ---------- Boot ----------
  function boot() {
    state.apiUrl = safeGetItem('ttc_api_url') || DEFAULT_API_URL;
    state.userName = safeGetItem('ttc_user_name') || '';
    if (!state.apiUrl) {
      document.getElementById('onboarding').hidden = false;
      return;
    }
    if (!safeGetItem('ttc_api_url')) safeSetItem('ttc_api_url', state.apiUrl);
    document.getElementById('mainApp').hidden = false;
    ensureUserName();
    buildStatusFilter();
    buildViewSwitch();
    loadMembers();
    refreshTasks();
    state.pollTimer = setInterval(function () { refreshTasks(false); }, 20000);
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) refreshTasks(false);
    });
  }

  function saveApiUrl() {
    var v = document.getElementById('onboardingUrlInput').value.trim();
    if (!v) return showToast('請輸入網址');
    safeSetItem('ttc_api_url', v);
    location.reload();
  }

  function ensureUserName() {
    if (state.userName) return;
    var name = prompt('第一次使用，請輸入你的稱呼（之後更新進度時會顯示）：');
    if (name && name.trim()) {
      state.userName = name.trim();
      safeSetItem('ttc_user_name', state.userName);
    }
  }

  // ---------- Rendering: filters ----------
  function buildStatusFilter() {
    var wrap = document.getElementById('statusFilter');
    var opts = ['全部'].concat(STATUS_ORDER);
    wrap.innerHTML = opts.map(function (s) {
      return '<button class="' + (state.statusFilter === s ? 'active' : '') + '" onclick="setStatusFilter(\'' + s + '\')">' + s + '</button>';
    }).join('');
  }
  function setStatusFilter(s) { state.statusFilter = s; buildStatusFilter(); renderTasks(); }

  function buildDeptFilter() {
    var wrap = document.getElementById('deptFilter');
    var depts = Array.from(new Set(
      state.tasks.map(function (t) { return t.department; })
        .concat(state.tasks.reduce(function (acc, t) { return acc.concat(t.supportDepts || []); }, []))
        .filter(Boolean)
    ));
    var opts = ['全部'].concat(depts);
    wrap.innerHTML = opts.map(function (d) {
      return '<button class="chip ' + (state.deptFilter === d ? 'active' : '') + '" onclick="setDeptFilter(\'' + escapeHtml(d).replace(/'/g, "\\'") + '\')">' + escapeHtml(d) + '</button>';
    }).join('');
  }
  function setDeptFilter(d) { state.deptFilter = d; buildDeptFilter(); renderTasks(); }

  function buildViewSwitch() {
    var wrap = document.getElementById('viewSwitch');
    var opts = [['list', '任務清單'], ['kanban', '看板'], ['overview', '部門總覽'], ['calendar', '時間軸'], ['gantt', '甘特圖'], ['feed', '最新動態']];
    wrap.innerHTML = opts.map(function (o) {
      return '<button class="' + (state.view === o[0] ? 'active' : '') + '" onclick="setView(\'' + o[0] + '\')">' + o[1] + '</button>';
    }).join('');
  }
  function setView(v) {
    state.view = v;
    buildViewSwitch();
    document.getElementById('listView').hidden = v !== 'list';
    document.getElementById('deptOverview').hidden = v !== 'overview';
    document.getElementById('calendarView').hidden = v !== 'calendar';
    document.getElementById('ganttView').hidden = v !== 'gantt';
    document.getElementById('kanbanView').hidden = v !== 'kanban';
    document.getElementById('feedView').hidden = v !== 'feed';
    if (v === 'calendar') renderCalendar();
    if (v === 'overview') renderWorkload();
    if (v === 'gantt') renderGantt();
    if (v === 'kanban') renderKanban();
    if (v === 'feed') renderFeed();
  }

  // ---------- Members directory ----------
  function loadMembers() {
    apiGet('members').then(function (res) {
      if (res.ok) state.members = res.members || [];
    });
  }
  function memberNames_() {
    return state.members.map(function (m) { return m.name; });
  }

  // ---------- Due date helpers ----------
  function todayStr_() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function dueInfo(dueDate) {
    if (!dueDate) return { label: '無截止日', cls: '' };
    var today = new Date(); today.setHours(0,0,0,0);
    var due = new Date(dueDate + 'T00:00:00');
    var diffDays = Math.round((due - today) / 86400000);
    if (diffDays < 0) return { label: '已逾期 ' + Math.abs(diffDays) + ' 天', cls: 'overdue' };
    if (diffDays === 0) return { label: '今天到期', cls: 'soon' };
    if (diffDays <= 3) return { label: '剩 ' + diffDays + ' 天', cls: 'soon' };
    return { label: dueDate, cls: '' };
  }

  function initials(name) {
    if (!name) return '?';
    var t = String(name).trim();
    return t.slice(0, 1).toUpperCase();
  }

  // ---------- Data load ----------
  function refreshTasks(showLoading) {
    if (!state.apiUrl) return;
    if (showLoading) showToast('重新整理中…');
    apiGet('list').then(function (res) {
      if (!res.ok) { showToast('讀取失敗：' + res.error); return; }
      state.tasks = res.tasks || [];
      buildDeptFilter();
      renderStats();
      renderReminders();
      renderTasks();
      renderDeptOverview();
      renderWorkload();
      if (state.view === 'calendar') renderCalendar();
      if (state.view === 'gantt') renderGantt();
    }).catch(function () { showToast('連線失敗，請檢查網路'); });
  }

  function activeTasks_() {
    return state.tasks.filter(function (t) { return !t.archived; });
  }

  function taskById_(id) {
    if (!id) return null;
    return state.tasks.find(function (x) { return x.id === id; }) || null;
  }

  function renderStats() {
    var pool = activeTasks_();
    var total = pool.length;
    var inProgress = pool.filter(function (t) { return t.status === '進行中'; }).length;
    var overdue = pool.filter(function (t) { return dueInfo(t.dueDate).cls === 'overdue' && t.status !== '已完成'; }).length;
    var soon = pool.filter(function (t) { return dueInfo(t.dueDate).cls === 'soon' && t.status !== '已完成'; }).length;
    var tiles = [
      { n: total, l: '總任務' },
      { n: inProgress, l: '進行中' },
      { n: soon, l: '即將到期' },
      { n: overdue, l: '已逾期', warn: true }
    ];
    document.getElementById('statRow').innerHTML = tiles.map(function (t) {
      return '<div class="stat-tile ' + (t.warn ? 'warn' : '') + '"><div class="stat-num">' + t.n + '</div><div class="stat-label">' + t.l + '</div></div>';
    }).join('');
  }

  function taskUrgencySort_(a, b) {
    var archA = a.archived ? 1 : 0, archB = b.archived ? 1 : 0;
    if (archA !== archB) return archA - archB;
    var doneA = a.status === '已完成' ? 1 : 0, doneB = b.status === '已完成' ? 1 : 0;
    if (doneA !== doneB) return doneA - doneB;
    var da = a.dueDate || '9999-99-99', db_ = b.dueDate || '9999-99-99';
    return da < db_ ? -1 : da > db_ ? 1 : 0;
  }

  // ---------- Reminders ----------
  function renderReminders() {
    var items = [];
    activeTasks_().forEach(function (t) {
      if (t.status === '已完成') return;
      var di = dueInfo(t.dueDate);
      if (di.cls) {
        items.push({ date: t.dueDate, cls: di.cls, dateLabel: '截止 · ' + di.label, label: t.title, sub: t.department || '未分類', taskId: t.id });
      }
      (t.milestones || []).forEach(function (m) {
        if (!m.date) return;
        var mi = dueInfo(m.date);
        if (mi.cls) {
          var when = mi.cls === 'overdue' ? mi.label.replace('已逾期', '已過') : (mi.cls === 'soon' && m.date === todayStr_() ? '就是今天' : m.date);
          items.push({ date: m.date, cls: mi.cls, dateLabel: when, label: m.label || '提醒事項', sub: t.title, taskId: t.id });
        }
      });
    });
    items.sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });

    var banner = document.getElementById('reminderBanner');
    if (items.length === 0) { banner.hidden = true; return; }
    banner.hidden = false;
    document.getElementById('reminderScroll').innerHTML = items.map(function (it) {
      var dateLabel = it.dateLabel;
      return '' +
        '<div class="reminder-card ' + it.cls + '" onclick="openTaskDetail(\'' + it.taskId + '\')">' +
          '<div class="reminder-card-date">' + escapeHtml(dateLabel) + '</div>' +
          '<div class="reminder-card-label">' + escapeHtml(it.label) + '</div>' +
          '<div class="reminder-card-sub">' + escapeHtml(it.sub) + '</div>' +
        '</div>';
    }).join('');
  }

  // ---------- Department overview ----------
  function renderDeptOverview() {
    var groups = {};
    activeTasks_().forEach(function (t) {
      var key = t.department || '未分類';
      if (!groups[key]) groups[key] = [];
      groups[key].push(t);
    });
    var rows = Object.keys(groups).map(function (name) {
      var tasks = groups[name];
      var total = tasks.length;
      var done = tasks.filter(function (t) { return t.status === '已完成'; }).length;
      var inProgress = tasks.filter(function (t) { return t.status === '進行中'; }).length;
      var overdue = tasks.filter(function (t) { return t.status !== '已完成' && dueInfo(t.dueDate).cls === 'overdue'; }).length;
      var pct = total ? Math.round((done / total) * 100) : 0;
      return { name: name, total: total, done: done, inProgress: inProgress, overdue: overdue, pct: pct };
    });
    rows.sort(function (a, b) { return b.overdue - a.overdue || (b.total - b.done) - (a.total - a.done); });

    var grid = document.getElementById('deptGrid');
    if (rows.length === 0) {
      grid.innerHTML = '<div class="empty-state"><div class="glyph">📊</div>還沒有任務資料</div>';
      return;
    }
    grid.innerHTML = rows.map(function (r) {
      return '' +
        '<div class="dept-card" onclick="jumpToDept(\'' + escapeHtml(r.name).replace(/'/g, "\\'") + '\')">' +
          '<div class="dept-card-top"><div class="dept-card-name">' + escapeHtml(r.name) + '</div><div class="dept-card-pct">' + r.pct + '% 完成</div></div>' +
          '<div class="dept-progress-track"><div class="dept-progress-fill" style="width:' + r.pct + '%;"></div></div>' +
          '<div class="dept-card-stats">' +
            '<span>共 ' + r.total + ' 項</span>' +
            '<span><span class="dept-stat-dot" style="background:var(--status-progress);"></span>進行中 ' + r.inProgress + '</span>' +
            (r.overdue > 0 ? '<span style="color:var(--danger); font-weight:700;"><span class="dept-stat-dot" style="background:var(--danger);"></span>逾期 ' + r.overdue + '</span>' : '') +
          '</div>' +
        '</div>';
    }).join('');
  }

  function renderWorkload() {
    var el = document.getElementById('workloadList');
    if (!el) return;
    var counts = {};
    activeTasks_().forEach(function (t) {
      if (t.status === '已完成') return;
      [t.assignee].concat(t.collaborators || []).filter(Boolean).forEach(function (name) {
        counts[name] = (counts[name] || 0) + 1;
      });
    });
    var rows = Object.keys(counts).map(function (name) { return { name: name, count: counts[name] }; });
    rows.sort(function (a, b) { return b.count - a.count; });
    if (rows.length === 0) {
      el.innerHTML = '<div style="color:var(--text-tertiary); font-size:13.5px; padding:6px 0;">目前沒有進行中的任務</div>';
      return;
    }
    var max = rows[0].count;
    el.innerHTML = rows.map(function (r) {
      return '' +
        '<div class="workload-row">' +
          '<div class="workload-name">' + escapeHtml(r.name) + '</div>' +
          '<div class="workload-bar-track"><div class="workload-bar-fill" style="width:' + Math.round((r.count / max) * 100) + '%;"></div></div>' +
          '<div class="workload-count">' + r.count + ' 項</div>' +
        '</div>';
    }).join('');
  }

  // ---------- Gantt view ----------
  function shiftGanttWindow(dir) {
    state.ganttOffset += dir * 28;
    renderGantt();
  }

  function renderGantt() {
    var el = document.getElementById('ganttRows');
    var scaleEl = document.getElementById('ganttScale');
    if (!el) return;
    var windowDays = 56;
    var start = new Date();
    start.setHours(0, 0, 0, 0);
    start.setDate(start.getDate() + state.ganttOffset);
    var end = new Date(start);
    end.setDate(end.getDate() + windowDays);
    document.getElementById('ganttTitle').textContent = fmtShort_(start) + ' – ' + fmtShort_(end);

    var weekMarks = [];
    for (var i = 0; i <= windowDays; i += 7) {
      var d = new Date(start); d.setDate(d.getDate() + i);
      weekMarks.push('<span style="flex:1;">' + fmtShort_(d) + '</span>');
    }
    scaleEl.innerHTML = weekMarks.join('');

    var tasks = activeTasks_().filter(function (t) {
      var s = t.startDate ? new Date(t.startDate) : (t.dueDate ? new Date(t.dueDate) : null);
      var e = t.dueDate ? new Date(t.dueDate) : s;
      if (!s || !e) return false;
      return e >= start && s <= end;
    });
    tasks.sort(function (a, b) { return (a.dueDate || '') < (b.dueDate || '') ? -1 : 1; });

    if (tasks.length === 0) {
      el.innerHTML = '<div class="empty-state"><div class="glyph">📅</div>這個區間沒有排定日期的任務</div>';
      return;
    }

    var todayOffsetPct = ((new Date().setHours(0, 0, 0, 0) - start) / 86400000) / windowDays * 100;
    var todayLine = (todayOffsetPct >= 0 && todayOffsetPct <= 100) ? '<div class="gantt-today-line" style="left:' + todayOffsetPct + '%;"></div>' : '';

    el.innerHTML = tasks.map(function (t) {
      var s = t.startDate ? new Date(t.startDate) : new Date(t.dueDate);
      var e = t.dueDate ? new Date(t.dueDate) : s;
      var clampedStart = Math.max(s, start);
      var clampedEnd = Math.min(new Date(e.getTime() + 86400000), end);
      var leftPct = Math.max(0, ((clampedStart - start) / 86400000) / windowDays * 100);
      var widthPct = Math.max(2, ((clampedEnd - clampedStart) / 86400000) / windowDays * 100);
      var deptColor = colorForKey_(t.department);
      return '' +
        '<div class="gantt-row">' +
          '<div class="gantt-label" title="' + escapeHtml(t.title) + '" onclick="openTaskDetail(\'' + t.id + '\')">' + escapeHtml(t.title) + '</div>' +
          '<div class="gantt-track">' + todayLine +
            '<div class="gantt-bar" style="left:' + leftPct + '%; width:' + widthPct + '%; background:' + deptColor + ';" title="' + escapeHtml(t.title) + '（' + (t.startDate || t.dueDate) + ' ~ ' + t.dueDate + '）" onclick="openTaskDetail(\'' + t.id + '\')"></div>' +
          '</div>' +
        '</div>';
    }).join('');
  }

  function fmtShort_(d) {
    return (d.getMonth() + 1) + '/' + d.getDate();
  }

  // ---------- Kanban board ----------
  function renderKanban() {
    var board = document.getElementById('kanbanBoard');
    var tasks = activeTasks_();
    board.innerHTML = STATUS_ORDER.map(function (status) {
      var col = tasks.filter(function (t) { return t.status === status; }).sort(taskUrgencySort_);
      var meta = STATUS_META[status];
      var nextIndex = STATUS_ORDER.indexOf(status) + 1;
      var nextStatus = STATUS_ORDER[nextIndex];
      var cards = col.map(function (t) {
        var di = dueInfo(t.dueDate);

  // ---------- Calendar / timeline view ----------
  function shiftCalMonth(delta) {
    state.calMonth += delta;
    if (state.calMonth < 0) { state.calMonth = 11; state.calYear--; }
    if (state.calMonth > 11) { state.calMonth = 0; state.calYear++; }
    renderCalendar();
  }

  function dayItemsMap_() {
    var map = {};
    activeTasks_().forEach(function (t) {
      if (t.dueDate) {
        (map[t.dueDate] = map[t.dueDate] || []).push({ title: t.title, taskId: t.id, color: (STATUS_META[t.status] || STATUS_META['待處理']).fg, sub: t.status });
      }
      (t.milestones || []).forEach(function (m) {
        if (!m.date) return;
        (map[m.date] = map[m.date] || []).push({ title: m.label || '提醒事項', taskId: t.id, color: 'var(--accent)', sub: t.title });
      });
    });
    return map;
  }

  function renderCalendar() {
    var y = state.calYear, m = state.calMonth;
    document.getElementById('calTitle').textContent = y + ' 年 ' + (m + 1) + ' 月';
    var firstOfMonth = new Date(y, m, 1);
    var startOffset = firstOfMonth.getDay();
    var daysInMonth = new Date(y, m + 1, 0).getDate();
    var daysInPrevMonth = new Date(y, m, 0).getDate();
    var todayStr = todayStr_();
    var items = dayItemsMap_();

    var cells = [];
    for (var i = 0; i < startOffset; i++) {
      cells.push({ label: daysInPrevMonth - startOffset + i + 1, other: true, dateStr: null });
    }
    for (var d = 1; d <= daysInMonth; d++) {
      var dateStr = y + '-' + String(m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
      cells.push({ label: d, other: false, dateStr: dateStr });
    }
    while (cells.length % 7 !== 0) {
      cells.push({ label: cells.length, other: true, dateStr: null });
    }

    var dow = ['日', '一', '二', '三', '四', '五', '六'].map(function (d) { return '<div class="cal-dow">' + d + '</div>'; }).join('');
    var cellsHtml = cells.map(function (c) {
      var dayItems = c.dateStr ? (items[c.dateStr] || []) : [];
      var dots = dayItems.slice(0, 4).map(function (it) { return '<span class="cal-dot" style="background:' + it.color + ';"></span>'; }).join('');
      var more = dayItems.length > 4 ? '<div class="cal-more">+' + (dayItems.length - 4) + '</div>' : '';
      return '' +
        '<div class="cal-cell ' + (c.other ? 'other-month' : '') + ' ' + (c.dateStr === todayStr ? 'is-today' : '') + '" ' +
          (c.dateStr ? 'onclick="openCalDay(\'' + c.dateStr + '\')"' : '') + '>' +
          '<div class="cal-cell-num">' + c.label + '</div>' +
          (dots ? '<div class="cal-dots">' + dots + '</div>' : '') +
          more +
        '</div>';
    }).join('');

    document.getElementById('calGrid').innerHTML = dow + cellsHtml;
  }

  function openCalDay(dateStr) {
    var items = (dayItemsMap_()[dateStr] || []);
    if (items.length === 0) return;
    var listHtml = items.map(function (it) {
      return '<div class="log-entry" style="cursor:pointer;" onclick="closeModal(); openTaskDetail(\'' + it.taskId + '\')">' +
        '<span class="cal-dot" style="background:' + it.color + '; margin-top:6px;"></span>' +
        '<div class="log-body"><div class="log-author">' + escapeHtml(it.title) + '</div><div class="log-text" style="margin-top:2px; color:var(--text-secondary);">' + escapeHtml(it.sub) + '</div></div>' +
      '</div>';
    }).join('');
    var html = '' +
      '<div class="modal-backdrop" onclick="if(event.target===this) closeModal()">' +
        '<div class="modal-sheet">' +
          '<div class="sheet-handle"></div>' +
          '<div class="sheet-header"><div class="sheet-title">' + escapeHtml(dateStr) + '</div><button class="icon-btn" onclick="closeModal()">✕</button></div>' +
          '<div class="log-list">' + listHtml + '</div>' +
        '</div>' +
      '</div>';
    document.getElementById('modalRoot').innerHTML = html;
  }

  function jumpToDept(name) {
    state.deptFilter = name;
    setView('list');
    buildDeptFilter();
    renderTasks();
  }

  var PRIORITY_FLAG = { '高': '🔺 高', '中': '● 中', '低': '▽ 低' };

  var DEPT_PALETTE = ['#5E5CE6', '#0A84FF', '#30B0C7', '#FF9F0A', '#FF375F', '#BF5AF2', '#34C759', '#A2845E'];
  function colorForKey_(key) {
    if (!key) return DEPT_PALETTE[0];
    var hash = 0;
    for (var i = 0; i < key.length; i++) hash = (hash * 31 + key.charCodeAt(i)) >>> 0;
    return DEPT_PALETTE[hash % DEPT_PALETTE.length];
  }

  function renderTasks() {
    var onlyMine = document.getElementById('onlyMineToggle').checked;
    var showArchived = document.getElementById('showArchivedToggle').checked;
    var query = (document.getElementById('searchInput').value || '').trim().toLowerCase();
    var list = state.tasks.filter(function (t) {
      if (!showArchived && t.archived) return false;
      if (state.statusFilter !== '全部' && t.status !== state.statusFilter) return false;
      if (state.deptFilter !== '全部' && t.department !== state.deptFilter && (t.supportDepts || []).indexOf(state.deptFilter) === -1) return false;
      if (onlyMine) {
        var mine = t.assignee === state.userName || (t.collaborators || []).indexOf(state.userName) !== -1;
        if (!mine) return false;
      }
      if (query && (t.title || '').toLowerCase().indexOf(query) === -1 && (t.notes || '').toLowerCase().indexOf(query) === -1) return false;
      return true;
    });
    list.sort(taskUrgencySort_);

    var listEl = document.getElementById('taskList');
    if (list.length === 0) {
      listEl.innerHTML = '<div class="empty-state"><div class="glyph">🗂️</div>沒有符合條件的任務</div>';
      return;
    }
    listEl.innerHTML = list.map(function (t) {
      var meta = STATUS_META[t.status] || STATUS_META['待處理'];
      var di = dueInfo(t.dueDate);
      var collabs = (t.collaborators || []);
      var supportDepts = (t.supportDepts || []);
      var priorityFlag = PRIORITY_FLAG[t.priority] || '';
      var deptColor = colorForKey_(t.department);
      var blockedBy = taskById_(t.dependsOn);
      var isBlocked = blockedBy && blockedBy.status !== '已完成';
      var delayDays = t.status !== '已完成' && t.dueDate && t.originalDueDate && t.dueDate > t.originalDueDate
        ? Math.round((new Date(t.dueDate) - new Date(t.originalDueDate)) / 86400000) : 0;
      var parent = taskById_(t.parentId);
      var peopleChips = ''
        + (t.assignee ? '<span class="person-chip host">🎯 ' + escapeHtml(t.assignee) + '</span>' : '')
        + collabs.map(function (c) { return '<span class="person-chip">🤝 ' + escapeHtml(c) + '</span>'; }).join('');
      return '' +
        '<div class="task-card ' + (t.archived ? 'is-archived' : '') + '" style="border-left:4px solid ' + deptColor + ';" onclick="openTaskDetail(\'' + t.id + '\')">' +
          (parent ? '<div class="parent-breadcrumb">⤷ 隸屬於：' + escapeHtml(parent.title) + '</div>' : '') +
          '<div class="task-top">' +
            '<div class="task-title">' + escapeHtml(t.title) + '</div>' +
            '<span class="status-pill" style="color:' + meta.fg + '; background:' + meta.bg + ';">' + escapeHtml(t.status) + '</span>' +
          '</div>' +
          '<div class="task-meta">' +
            (t.department ? '<span class="meta-tag" style="color:' + deptColor + '; background:color-mix(in srgb, ' + deptColor + ' 16%, var(--surface-2));">' + escapeHtml(t.department) + '</span>' : '') +
            supportDepts.map(function (d) { return '<span class="meta-tag">+ ' + escapeHtml(d) + '</span>'; }).join('') +
            (t.brand ? '<span class="meta-tag">' + escapeHtml(t.brand) + '</span>' : '') +
            '<span class="due-badge ' + di.cls + '">' + di.label + '</span>' +
            (priorityFlag ? '<span class="priority-flag ' + t.priority + '">' + priorityFlag + '</span>' : '') +
            (delayDays > 0 ? '<span class="delay-tag">⏰ 較原訂延後 ' + delayDays + ' 天</span>' : '') +
            (isBlocked ? '<span class="blocked-tag">⛔ 待前置任務完成</span>' : '') +
            (t.archived ? '<span class="archived-tag">已封存</span>' : '') +
          '</div>' +
          (peopleChips ? '<div class="person-chip-row">' + peopleChips + '</div>' : '') +
        '</div>';
    }).join('');
  }

      state.members = res.members || [];
      renderSettingsModal();

        .filter(Boolean)
    ));
    var brands = Array.from(new Set(state.tasks.map(function (x) { return x.brand; }).filter(Boolean)));
    var assignees = Array.from(new Set(memberNames_().concat(state.tasks.map(function (x) { return x.assignee; })).filter(Boolean)));

      '<label class="field-label">任務標題</label>' +

      '<label class="field-label">主要負責部門</label>' +

      '<label class="field-label">品牌／系列</label>' +

      '<datalist id="assigneeList">' + assignees.map(function (a) { return '<option value="' + escapeHtml(a) + '">'; }).join('') + '</datalist>' +

      '<input type="text" id="tfCollab" placeholder="以逗號分隔，例如：小美, 小華" value="' + escapeHtml((t.collaborators || []).join(', ')) + '">' +
      '<label class="field-label">優先級</label>' +

      '<select id="tfDependsOn">' + otherTaskOptions_(t.id, t.dependsOn, '無') + '</select>' +
      '<label class="field-label">所屬大案子（選填）</label>' +

  function otherTaskOptions_(selfId, selectedId, blankLabel) {

      .join('');

      '<div class="modal-backdrop" onclick="if(event.target===this) closeModal()">' +

          '<div class="sheet-header"><div class="sheet-title">新增任務</div><button class="icon-btn" onclick="closeModal()">✕</button></div>' +

  function readFileAsBase64_(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () { resolve(String(reader.result).split(',')[1]); };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function attachFileIfAny_() {
    var input = document.getElementById('tfFile');
    var file = input && input.files && input.files[0];
    if (!file) return Promise.resolve(null);
    if (file.size > 5 * 1024 * 1024) { showToast('檔案超過 5MB，請改貼連結'); return Promise.resolve(null); }
    showToast('附件上傳中…');
    return readFileAsBase64_(file).then(function (base64) {
      return apiPost({ action: 'uploadFile', filename: file.name, mimeType: file.type, dataBase64: base64 });
    }).then(function (res) {
      if (!res.ok) { showToast('附件上傳失敗：' + res.error); return null; }
      return res.file.url;
    }).catch(function () { showToast('附件上傳失敗'); return null; });
  }

  function submitNewTask() {
    var form = readTaskForm_();
    if (!form.title) return showToast('請輸入任務標題');
    attachFileIfAny_().then(function (uploadedUrl) {
      if (uploadedUrl) form.link = uploadedUrl;
      var payload = Object.assign({ action: 'createTask', status: '待處理', createdBy: state.userName }, form);
      apiPost(payload).then(function (res) {
        if (!res.ok) return showToast('建立失敗：' + res.error);
        closeModal();
        showToast('已建立任務');
        refreshTasks();
      });
    });
  }

        '</div>' +
      '</div>';
    document.getElementById('modalRoot').innerHTML = html;
  }

  function submitEditTask(id) {
    var form = readTaskForm_();
    if (!form.title) return showToast('請輸入任務標題');
    attachFileIfAny_().then(function (uploadedUrl) {
      if (uploadedUrl) form.link = uploadedUrl;
      var payload = Object.assign({ action: 'updateTask', id: id }, form);
      apiPost(payload).then(function (res) {
        if (!res.ok) return showToast('儲存失敗：' + res.error);
        showToast('已儲存變更');
        refreshTasks();
        openTaskDetail(id);
      });
    });
  }

  function openDuplicateTask(id) {
    var t = state.tasks.find(function (x) { return x.id === id; });
    if (!t) return;
    var clone = Object.assign({}, t, { title: t.title + '（複製）', dueDate: '', startDate: '', status: '待處理', id: undefined });
    var html = '' +
      '<div class="modal-backdrop" onclick="if(event.target===this) closeModal()">' +
        '<div class="modal-sheet">' +
          '<div class="sheet-handle"></div>' +
          '<div class="sheet-header"><div class="sheet-title">複製任務</div><button class="icon-btn" onclick="closeModal()">✕</button></div>' +
          '<div style="color:var(--text-secondary); font-size:13.5px; margin-bottom:6px;">已帶入原任務的部門/人員/說明，記得設定新的日期</div>' +
          taskFormFieldsHtml_(clone) +
          '<div style="margin-top:18px;"><button class="primary-btn" style="width:100%; justify-content:center;" onclick="submitNewTask()">建立這個複製任務</button></div>' +
        '</div>' +
      '</div>';
    document.getElementById('modalRoot').innerHTML = html;
  }

  function toggleArchive(id, archived) {
    apiPost({ action: 'updateTask', id: id, archived: archived }).then(function (res) {
      if (!res.ok) return showToast('操作失敗：' + res.error);
      showToast(archived ? '已封存任務' : '已取消封存');
      closeModal();
      refreshTasks();
    });
  }

  function openTaskDetail(id) {
    var t = state.tasks.find(function (x) { return x.id === id; });
    if (!t) return;
    renderDetailModal(t, []);
    apiGet('updates', { taskId: id }).then(function (res) {
      if (res.ok) renderDetailModal(t, res.updates || []);
    });
  }

  function renderDetailModal(t, updates) {
    var meta = STATUS_META[t.status] || STATUS_META['待處理'];
    var di = dueInfo(t.dueDate);
    var collabs = (t.collaborators || []);
    var supportDepts = (t.supportDepts || []);
    var deptColor = colorForKey_(t.department);
    var blockedBy = taskById_(t.dependsOn);
    var parent = taskById_(t.parentId);
    var children = state.tasks.filter(function (x) { return x.parentId === t.id; });
    var delayDays = t.status !== '已完成' && t.dueDate && t.originalDueDate && t.dueDate > t.originalDueDate
      ? Math.round((new Date(t.dueDate) - new Date(t.originalDueDate)) / 86400000) : 0;
    var statusOptions = STATUS_ORDER.map(function (s) {
      return '<option value="' + s + '"' + (s === t.status ? ' selected' : '') + '>' + s + '</option>';
    }).join('');

    var logHtml = updates.slice().reverse().map(function (u) {
      return '' +
        '<div class="log-entry">' +
          '<span class="avatar" style="margin-left:0;">' + initials(u.author) + '</span>' +
          '<div class="log-body">' +
            '<div class="log-head"><span class="log-author">' + escapeHtml(u.author || '匿名') + '</span><span class="log-time">' + escapeHtml((u.createdAt || '').replace('T', ' ')) + '</span></div>' +
            (u.text ? '<div class="log-text">' + escapeHtml(u.text) + '</div>' : '') +
            (u.statusSnapshot ? '<span class="log-status-tag" style="color:' + (STATUS_META[u.statusSnapshot] || STATUS_META['待處理']).fg + '; background:' + (STATUS_META[u.statusSnapshot] || STATUS_META['待處理']).bg + ';">狀態 → ' + escapeHtml(u.statusSnapshot) + '</span>' : '') +
          '</div>' +
        '</div>';
    }).join('') || '<div style="color:var(--text-tertiary); font-size:14px; text-align:center; padding:12px 0;">還沒有進度紀錄</div>';

    var milestones = (t.milestones || []).slice().sort(function (a, b) { return (a.date || '') < (b.date || '') ? -1 : 1; });
    var milestoneListHtml = milestones.map(function (m) {
      return '<div class="milestone-item"><span class="milestone-date">' + escapeHtml(m.date || '') + '</span><span class="milestone-label">' + escapeHtml(m.label) + '</span></div>';
    }).join('') || '<div style="color:var(--text-tertiary); font-size:13.5px;">尚未新增提醒事項</div>';

    var html = '' +
      '<div class="modal-backdrop" onclick="if(event.target===this) closeModal()">' +
        '<div class="modal-sheet">' +
          '<div class="sheet-handle"></div>' +
          '<div class="sheet-header">' +
            '<div class="sheet-title">' + escapeHtml(t.title) + (t.archived ? ' <span class="archived-tag">已封存</span>' : '') + '</div>' +
            '<div style="display:flex; gap:6px;">' +
              '<button class="icon-btn" onclick="openEditTask(\'' + t.id + '\')" title="編輯">✎</button>' +
              '<button class="icon-btn" onclick="closeModal()">✕</button>' +
            '</div>' +
          '</div>' +

          '<div class="status-select-wrap">' +
            '<select class="status-select" id="detailStatus" style="color:' + meta.fg + '; background:' + meta.bg + '; border-color:' + meta.fg + ';" onchange="changeStatus(\'' + t.id + '\')">' + statusOptions + '</select>' +
          '</div>' +

          (parent ? '<div class="parent-breadcrumb" style="margin-bottom:8px; cursor:pointer;" onclick="openTaskDetail(\'' + parent.id + '\')">⤷ 隸屬於：' + escapeHtml(parent.title) + '</div>' : '') +
          (blockedBy ? '<div class="info-item" style="margin-bottom:12px; cursor:pointer;" onclick="openTaskDetail(\'' + blockedBy.id + '\')"><div class="k">前置任務</div><div class="v ' + (blockedBy.status !== '已完成' ? 'blocked-tag' : '') + '">' + (blockedBy.status !== '已完成' ? '⛔ ' : '✅ ') + escapeHtml(blockedBy.title) + '（' + escapeHtml(blockedBy.status) + '）</div></div>' : '') +

          '<div class="info-grid">' +
            '<div class="info-item"><div class="k">主要負責部門</div><div class="v" style="color:' + deptColor + ';">' + escapeHtml(t.department || '—') + '</div></div>' +
            '<div class="info-item"><div class="k">品牌／系列</div><div class="v">' + escapeHtml(t.brand || '—') + '</div></div>' +
            '<div class="info-item"><div class="k">專案主持人</div><div class="v">' + escapeHtml(t.assignee || '未指派') + '</div></div>' +
            '<div class="info-item"><div class="k">開始日期</div><div class="v">' + escapeHtml(t.startDate || '未設定') + '</div></div>' +
            '<div class="info-item"><div class="k">截止日期</div><div class="v ' + (di.cls === 'overdue' ? 'due-badge overdue' : '') + '">' + escapeHtml(t.dueDate || '未設定') + (di.cls ? '（' + di.label + '）' : '') + (delayDays > 0 ? ' <span class="delay-tag">⏰ 延後' + delayDays + '天</span>' : '') + '</div></div>' +
            '<div class="info-item"><div class="k">優先級</div><div class="v priority-flag ' + (t.priority || '中') + '">' + (PRIORITY_FLAG[t.priority] || PRIORITY_FLAG['中']) + '</div></div>' +
            (t.link ? '<div class="info-item"><div class="k">參考連結</div><div class="v"><a class="task-link" href="' + escapeHtml(t.link) + '" target="_blank" rel="noopener">🔗 開啟連結</a></div></div>' : '') +
          '</div>' +
          (supportDepts.length ? '<div class="info-item" style="margin:-4px 0 14px;"><div class="k">協力部門</div><div class="collab-chips">' + supportDepts.map(function (d) { return '<span class="collab-chip">' + escapeHtml(d) + '</span>'; }).join('') + '</div></div>' : '') +
          (collabs.length ? '<div class="info-item" style="margin:-4px 0 14px;"><div class="k">協辦人員</div><div class="collab-chips">' + collabs.map(function (c) { return '<span class="collab-chip">' + escapeHtml(c) + '</span>'; }).join('') + '</div></div>' : '') +
          (t.notes ? '<div class="info-item" style="margin-bottom:14px;"><div class="k">說明</div><div class="v" style="font-weight:500;">' + escapeHtml(t.notes) + '</div></div>' : '') +

          (children.length ? (
            '<hr class="divider">' +
            '<label class="field-label" style="margin-top:0;">子任務（' + children.filter(function (c) { return c.status === '已完成'; }).length + '/' + children.length + ' 完成）</label>' +
            '<div class="subtask-list">' + children.map(function (c) {
              var cm = STATUS_META[c.status] || STATUS_META['待處理'];
              return '<div class="subtask-item" onclick="openTaskDetail(\'' + c.id + '\')"><span class="subtask-title">' + escapeHtml(c.title) + '</span><span class="status-pill" style="color:' + cm.fg + '; background:' + cm.bg + ';">' + escapeHtml(c.status) + '</span></div>';
            }).join('') + '</div>'
          ) : '') +

          '<hr class="divider">' +
          '<label class="field-label" style="margin-top:0;">提醒事項（開會、繳交資料等重要日期）</label>' +
          '<div class="milestone-list">' + milestoneListHtml + '</div>' +
          '<div class="milestone-add-row">' +
            '<input type="date" id="msDate">' +
            '<input type="text" id="msLabel" placeholder="例如：部門會議 / 送交設計稿">' +
            '<button class="secondary-btn" onclick="submitMilestone(\'' + t.id + '\')">加入</button>' +
          '</div>' +

          '<hr class="divider">' +
          '<label class="field-label" style="margin-top:0;">進度紀錄</label>' +
          '<div class="log-list">' + logHtml + '</div>' +

          '<div class="compose-row">' +
            '<textarea id="composeText" placeholder="新增進度說明…"></textarea>' +
            '<button class="primary-btn" onclick="submitUpdate(\'' + t.id + '\')">送出</button>' +
          '</div>' +

          '<div style="display:flex; justify-content:center; flex-wrap:wrap; gap:18px; margin-top:18px;">' +
            '<button class="text-btn" onclick="openDuplicateTask(\'' + t.id + '\')">複製任務</button>' +
            '<button class="text-btn" onclick="toggleArchive(\'' + t.id + '\', ' + (!t.archived) + ')">' + (t.archived ? '取消封存' : '封存此任務') + '</button>' +
            '<button class="danger-text-btn" onclick="removeTask(\'' + t.id + '\')">刪除此任務</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    document.getElementById('modalRoot').innerHTML = html;
  }

  function changeStatus(id) {
    var newStatus = document.getElementById('detailStatus').value;
    apiPost({ action: 'addUpdate', taskId: id, author: state.userName || '未署名', text: '', newStatus: newStatus }).then(function (res) {
      if (!res.ok) return showToast('更新失敗：' + res.error);
      showToast('狀態已更新為「' + newStatus + '」');
      refreshTasks();
      openTaskDetail(id);
    });
  }

  function submitUpdate(id) {
    var text = document.getElementById('composeText').value.trim();
    if (!text) return showToast('請輸入進度內容');
    apiPost({ action: 'addUpdate', taskId: id, author: state.userName || '未署名', text: text }).then(function (res) {
      if (!res.ok) return showToast('送出失敗：' + res.error);
      showToast('已新增進度');
      refreshTasks();
      openTaskDetail(id);
    });
  }

  function submitMilestone(id) {
    var date = document.getElementById('msDate').value;
    var label = document.getElementById('msLabel').value.trim();
    if (!date || !label) return showToast('請填寫日期跟說明');
    apiPost({ action: 'addMilestone', taskId: id, date: date, label: label }).then(function (res) {
      if (!res.ok) return showToast('新增失敗：' + res.error);
      showToast('已新增提醒事項');
      refreshTasks();
      openTaskDetail(id);
    });
  }

  function removeTask(id) {
    if (!confirm('確定要刪除這個任務嗎？此動作無法復原。')) return;
    apiPost({ action: 'deleteTask', id: id }).then(function (res) {
      if (!res.ok) return showToast('刪除失敗：' + res.error);
      closeModal();
      showToast('已刪除任務');
      refreshTasks();
    });
  }

  boot();
</script>
</body>
</html>
